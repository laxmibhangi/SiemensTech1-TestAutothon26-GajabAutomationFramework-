[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results

markers =
    web: browser based tests
    android: tests that require a connected Android device
    e2e: the full end-to-end bargain journey
    smoke: quick confidence checks
    a11y: accessibility checks
    negative: negative / boundary scenarios

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
